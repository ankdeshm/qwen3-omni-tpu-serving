apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-cpu-offload-svc
  namespace: default
  labels:
    app: multimodal-cpu-offload-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multimodal-cpu-offload-svc
  template:
    metadata:
      labels:
        app: multimodal-cpu-offload-svc
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: YOUR_CPU_NODEPOOL
      containers:
      - name: offload-server
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: PORT
          value: "8090"
        command: ["python3", "-u", "/workspace/scripts/multimodal_cpu_offload_server.py"]
        resources:
          requests:
            cpu: "38"
            memory: "140Gi"
          limits:
            cpu: "42"
            memory: "160Gi"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 80Gi
---
apiVersion: v1
kind: Service
metadata:
  name: multimodal-cpu-offload-svc
  namespace: default
spec:
  selector:
    app: multimodal-cpu-offload-svc
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP
