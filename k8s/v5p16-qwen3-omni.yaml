apiVersion: batch/v1
kind: Job
metadata:
  name: v5p16-qwen3-omni
  namespace: default
  labels:
    app: v5p16-qwen3-omni
    model: qwen3-omni-30b-a3b
    slice: v5p-16
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 16
  template:
    metadata:
      labels:
        app: v5p16-qwen3-omni
        model: qwen3-omni-30b-a3b
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: omni-bench
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: MULTIMODAL_CPU_OFFLOAD_URL
          value: "http://multimodal-cpu-offload-svc.default.svc.cluster.local:8090"
        - name: HF_HOME
          value: "/dev/shm/hf_cache"
        - name: TMPDIR
          value: "/dev/shm/tmp"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/dev/shm/torchinductor"
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=380G /dev/shm || true
          rm -rf /dev/shm/* 2>/dev/null || true
          mkdir -p /dev/shm/hf_cache /dev/shm/tmp /dev/shm/torchinductor /tmp/omni_bench

          TOK=$(curl -sS -H "Metadata-Flavor: Google" \
            "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")

          for f in gcs_stager.py tpu_single_host_setup.py cpu_offload_client.py run_qwen3_omni_tpu_bench.py; do
            curl -fsSL -H "Authorization: Bearer ${TOK}" \
              "https://storage.googleapis.com/storage/v1/b/YOUR_GCS_BUCKET/o/omni-world-portfolio%2Fscripts%2F${f}?alt=media" \
              -o "/tmp/omni_bench/${f}"
          done

          exec python3 -u /tmp/omni_bench/run_qwen3_omni_tpu_bench.py \
            --chip-type=v5p \
            --slice-name=v5p-16 \
            --num-hosts=4 \
            --cores-per-host=4 \
            --use-shm
        resources:
          requests:
            google.com/tpu: "4"
            memory: "350Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
