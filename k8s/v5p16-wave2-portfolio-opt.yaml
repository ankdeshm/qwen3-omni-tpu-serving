apiVersion: batch/v1
kind: Job
metadata:
  name: v5p16-wave2-portfolio-opt
  namespace: default
  labels:
    app: v5p16-wave2-portfolio-opt
    suite: omni-world-portfolio-wave2
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 12
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v5p16-wave2-portfolio-opt
        suite: omni-world-portfolio-wave2
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 15
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/tpu-worker-node: tpu-v5p-16-pool
        cloud.google.com/tpu-worker-node: tpu-v5p-slice
        cloud.google.com/tpu-worker-node: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/tpu-worker-node"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/tpu-worker-node"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: tpu-bench
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: MULTIMODAL_CPU_OFFLOAD_URL
          value: "http://multimodal-cpu-offload-svc.default.svc.cluster.local:8090"
        resources:
          requests:
            google.com/tpu: "4"
            memory: "350Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=380G /dev/shm || true
          rm -rf /dev/shm/* /dev/shm/.[!.]* /dev/shm/..?* 2>/dev/null || true
          mkdir -p /dev/shm/tmp /dev/shm/hf_cache /dev/shm/uv_cache /dev/shm/pip_cache /dev/shm/torchinductor /tmp/omni_bench
          BUCKET="YOUR_GCS_BUCKET"
          TOK=$(curl -sS -H "Metadata-Flavor: Google" \
            "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          for SCRIPT in gcs_stager.py tpu_single_host_setup.py cpu_offload_client.py \
            run_gr00t_vla_tpu_bench.py run_qwen3_omni_tpu_bench.py \
            run_cosmos3_super_tpu_bench.py run_hunyuan_image3_tpu_bench.py; do
            curl -fsSL --retry 4 --retry-delay 2 -H "Authorization: Bearer ${TOK}" \
              "https://storage.googleapis.com/storage/v1/b/${BUCKET}/o/omni-world-portfolio%2Fscripts%2F${SCRIPT}?alt=media" \
              -o "/tmp/omni_bench/${SCRIPT}"
          done
          IDX="${JOB_COMPLETION_INDEX:-0}"
          unset JOB_COMPLETION_INDEX
          case "${IDX}" in
            0)
              echo "[wave2-v5p16-host-0] Running patched GR00T-N1.7-3B (100% PASS B=1..32 + Disagg Vision Offload)..."
              python3 -u /tmp/omni_bench/run_gr00t_vla_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16 --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/gr00t-n1-7-3b
              ;;
            1)
              echo "[wave2-v5p16-host-1] Running patched Qwen3-Omni-30B-A3B (vLLM-TorchTPU-EP + Fixed FP8_DYNAMIC Compiled)..."
              python3 -u /tmp/omni_bench/run_qwen3_omni_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16 --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/qwen3-omni
              ;;
            2)
              echo "[wave2-v5p16-host-2] Running Cosmos3-Super on v5p-16 (scaling comparison vs v5p-32 + AVX-512 Offload)..."
              python3 -u /tmp/omni_bench/run_cosmos3_super_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16 --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/cosmos3-super
              ;;
            3)
              echo "[wave2-v5p16-host-3] Running HunyuanImage-3.0 on v5p-16 (scaling comparison vs v5p-32 + AVX-512 Offload)..."
              python3 -u /tmp/omni_bench/run_hunyuan_image3_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16 --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/hunyuan-image-3
              ;;
          esac
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
